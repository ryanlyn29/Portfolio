<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryan | Portfolio</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        
        background-color: #fdfbf7; 
        overflow: hidden;
        overscroll-behavior-x: none; 
      }
      
      #root {
        width: 100%;
        height: 100%;
      }
      
      
      
      .custom-scrollbar {
        overflow-y: auto;

        scrollbar-width: none;

        -ms-overflow-style: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
            .custom-scrollbar-show {
        overflow-y: auto;

        scrollbar-width: thin;
        scrollbar-color: rgb(78, 75, 75) transparent;
      }

      .custom-scrollbar-show::-webkit-scrollbar {
        width: 6px;              
        height: 6px;              
      }

      .custom-scrollbar-show::-webkit-scrollbar-track {
        
        background-color: transparent;
      }

      .custom-scrollbar-show::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.35);
        border-radius: 999px;

        border: 2px solid transparent;
        background-clip: content-box;

        min-height: 40px;        
      }

      .dark .custom-scrollbar-show::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.3);
}

    </style>

      }

</head>
